<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridForce — Phase 0</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0a0f;
        color: #cfd6e0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
      }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .lobby {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: rgba(10, 10, 15, 0.92);
        z-index: 10;
      }
      .lobby h1 { margin: 0 0 1rem; letter-spacing: 0.2em; font-size: 2.5rem; color: #6ee7ff; }
      .lobby button, .lobby input {
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        background: #1a1a2e;
        color: #cfd6e0;
        border: 1px solid #303048;
        border-radius: 6px;
        font-family: inherit;
      }
      .lobby button { cursor: pointer; min-width: 12rem; }
      .lobby button:hover { background: #232342; border-color: #6ee7ff; }
      .lobby .row { display: flex; gap: 0.5rem; }
      .lobby .err { color: #ff6e6e; min-height: 1.2em; }
      #hud {
        position: fixed; top: 8px; left: 8px;
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 12px;
        color: #6ee7ff;
        background: rgba(0,0,0,0.4);
        padding: 6px 8px;
        border-radius: 4px;
        white-space: pre;
        pointer-events: none;
        z-index: 5;
      }
      #netsim {
        position: fixed; top: 8px; right: 8px;
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 11px;
        color: #ffcc6e;
        background: rgba(0,0,0,0.4);
        padding: 6px 8px;
        border-radius: 4px;
        z-index: 5;
        cursor: pointer;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud" hidden></div>
    <div id="netsim" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
