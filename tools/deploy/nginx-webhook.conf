# Webhook reverse-proxy snippet.
# Drop into /etc/nginx/sites-available/gridforce-webhook and symlink into sites-enabled.
# Replace YOUR_DOMAIN. Get a cert with `sudo certbot --nginx -d YOUR_DOMAIN`.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # certbot will rewrite this block to listen on 443 + redirect 80.
    location /webhook {
        proxy_pass http://127.0.0.1:9000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /webhook/health {
        proxy_pass http://127.0.0.1:9000/health;
    }

    location / {
        return 404;
    }
}
