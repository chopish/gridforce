# Unified nginx site for grid.clab.su.
# Drop into /etc/nginx/sites-available/gridforce and symlink into sites-enabled.
# Disable any other config that claims grid.clab.su (e.g. the default site).

# 80 -> 443 redirect.
server {
    listen 80;
    listen [::]:80;
    server_name grid.clab.su;
    return 301 https://$host$request_uri;
}

# Main HTTPS server.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grid.clab.su;

    ssl_certificate     /etc/letsencrypt/live/grid.clab.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grid.clab.su/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # GitHub deploy webhook -> receiver on 127.0.0.1:9000
    location /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    # Game WebSocket -> server on 127.0.0.1:8080 (needs upgrade headers)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Game HTTP API -> server on 127.0.0.1:8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static client (Vite build output). SPA fallback to index.html.
    root /opt/gridforce/packages/client/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
